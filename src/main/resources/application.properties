spring.application.name=VasilePersonalSite

# Spring Cloud (portato da OpenFeign) risolve all'avvio, due volte, il nome host locale
# tramite reverse DNS, con timeout di 1s ciascuna ("Cannot determine local hostname").
# Il valore serve solo a service discovery / registry, non usati da questa applicazione:
# con 0 si usa subito il fallback "localhost". Nessun effetto su Feign/GitHub.
spring.cloud.inetutils.timeout-seconds=0

# Documentazione OpenAPI / Swagger UI disattivata in produzione (non usata dal frontend):
# meno lavoro all'avvio e nessuna mappa pubblica delle API. Riattivata nel profilo dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.address=0.0.0.0
server.port=${PORT:8080}


git.username = ${GIT_USERNAME}

#app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# application.properties / application.yml
github.token=${GITHUB_TOKEN}

#configuarzione dataSource

#spring.datasource.url=${JDBC_URL:jdbc:mysql://localhost/VasilePersonalDB}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# HikariCP - CANDIDATA (intervento E), NON ancora attiva.
# I valori sotto replicano esattamente i default attuali di Hikari 5.0.1, quindi il
# comportamento è invariato. La configurazione candidata è documentata nel report e
# si attiva SOLO via variabili d'ambiente, dopo il test su un PostgreSQL rappresentativo:
#   HIKARI_MAX_POOL=5  HIKARI_MIN_IDLE=1  HIKARI_IDLE_TIMEOUT_MS=120000
# max-lifetime e keepalive restano ai default: una vita più corta sostituirebbe le
# connessioni più spesso e ogni nuova connessione può risvegliare il compute Neon.
# ---------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_MS:0}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


chiave.SimpleAES=${CHIAVE_AES}
admin.password=${UNIVERSAL_PASSWORD}

# numero di login falliti consecutivi prima del blocco dell'utenza
security.login.max-tentativi=${MAX_TENTATIVI_LOGIN:5}

lezioni.notification.to=${MIA_MAIL}

security.jwt.secret=${JWT_SECRET:pippo}
security.jwt.ttl-seconds=7200

personal.domain=${PERSONAL_DOMAIN:http://localhost:4200}

mailjet.api.key=${MAILJET_API_KEY}
mailjet.api.secret=${MAILJET_SECRET_KEY}
mailjet.sender.email=${MAIL_SENDER}
mailjet.sender.name=${MAIL_NAME}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Google Calendar / Meet: crea il link della videolezione alla conferma
# (se vuote il link non viene generato e la conferma funziona comunque)
google.calendar.client-id=${GOOGLE_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET}
google.calendar.refresh-token=${GOOGLE_REFRESH_TOKEN}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}

# ---------------------------------------------------------------------------
# Snapshot pubblico del calendario su Google Drive (lettura immediata dal frontend
# mentre il backend è spento). DISATTIVATO di default: senza queste variabili il
# comportamento è identico a prima. Nessuna scrittura su Drive dopo le prenotazioni:
# si pubblica solo allo shutdown dell'istanza (se qualcosa è cambiato) o dall'endpoint admin.
# Il refresh token è DEDICATO (solo scope drive.file), distinto da quello di Calendar.
# ---------------------------------------------------------------------------
calendario.snapshot.enabled=${CALENDARIO_SNAPSHOT_ENABLED:false}
calendario.snapshot.publish-on-shutdown=${CALENDARIO_SNAPSHOT_PUBLISH_ON_SHUTDOWN:false}
calendario.snapshot.drive-file-id=${CALENDARIO_SNAPSHOT_DRIVE_FILE_ID:1MjF9KZAtW6jLXVfbdj6kTEQYQcjcLnVT}
calendario.snapshot.client-id=${GOOGLE_CLIENT_ID}
calendario.snapshot.client-secret=${GOOGLE_CLIENT_SECRET}
calendario.snapshot.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN:}
calendario.snapshot.settimane=${CALENDARIO_SNAPSHOT_SETTIMANE:8}
calendario.snapshot.connect-timeout-ms=3000
calendario.snapshot.request-timeout-ms=10000
calendario.snapshot.shutdown-budget-ms=${CALENDARIO_SNAPSHOT_SHUTDOWN_BUDGET_MS:15000}
