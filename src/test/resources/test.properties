# Configurazione dei test automatici.
# Caricata con @TestPropertySource: ha precedenza anche sulle variabili d'ambiente,
# quindi i test non si collegano MAI al database reale (Neon) anche se l'env di
# produzione e' caricato. Tutti i valori sono fittizi.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

git.username=test
github.token=
app.cors.allowed-origins=http://localhost:4200

chiave.SimpleAES=test-chiave-aes-16
admin.password=universal-test-password
security.login.max-tentativi=3
security.jwt.secret=test-jwt-secret-almeno-32-byte-per-hs256-0123456789
security.jwt.ttl-seconds=7200

lezioni.notification.to=admin@example.invalid
personal.domain=http://localhost:4200

mailjet.api.key=test
mailjet.api.secret=test
mailjet.sender.email=noreply@example.invalid
mailjet.sender.name=Test

google.calendar.client-id=
google.calendar.client-secret=
google.calendar.refresh-token=
google.calendar.calendar-id=primary
